<!doctype html>
<html lang="ru" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>Flask Нативный WebSocket Чат</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}"
    />
    <style>
      #chat {
        height: 450px;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: var(--bs-tertiary-bg);
      }
      #chat::-webkit-scrollbar {
        width: 6px;
      }
      #chat::-webkit-scrollbar-thumb {
        background-color: var(--bs-border-color);
        border-radius: 3px;
      }
      .bg_dark {
        background-color: #141313;
      }
      .card {
        height: 95vh;
      }
      #container_link {
        overflow-y: auto;
      }
      .bubble-left {
        display: flex;
        margin-right: auto;
        max-width: 300px;
        justify-content: flex-start;
      }
      .bubble-right {
        display: flex;
        margin-left: auto;
        max-width: 300px;
        justify-content: flex-end;
        overflow-wrap: break-word;
      }
    </style>
  </head>
  <body class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-4">
          <!-- Карточка чата -->
          <div class="card border-0 bg_dark">
            <!-- Шапка -->
            <div
              class="card-header bg-secondary text-white d-flex align-items-center py-3"
            >
              <h5 class="card-title mb-0 fw-semibold">
                Уведомления из скрипта
              </h5>
              <span
                class="badge bg-success-subtle text-success ms-auto d-flex align-items-center gap-1"
                id="statusBadge"
              >
                <span
                  class="spinner-grow spinner-grow-sm"
                  role="status"
                  id="statusSpinner"
                ></span>
                <span id="statusText">Подключение</span>
              </span>
            </div>

            <!-- Тело с сообщениями -->
            <!-- Важно: у контейнера должен быть класс d-flex flex-column -->
            <div class="card-body p-3 d-flex flex-column gap-2" id="chat">
              <div class="text-center text-muted small my-auto" id="emptyState">
                История уведомлений пуста
              </div>
            </div>
          </div>
        </div>
        <div class="col-8 px-5">
          <div class="card border-0 bg_dark">
            <!-- Шапка -->
            <div
              class="card-header bg-secondary text-white d-flex align-items-center py-3"
            >
              <h5 class="card-title mb-0 py-4 fw-semibold">^=• 𖥦 •=^</h5>
            </div>

            

              <div class="px-5 py-5">
                <div class="mb-3">
                  <label for="link" class="form-label"
                    >Ссылка</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="form_link"
                    aria-describedby="linkHelp"
                  />
                  <div id="linkHelp" class="form-text">
                    Вставте ссылку
                  </div>
                </div>

                <div class="mb-3">
                  <label for="name" class="form-label"
                    >Имя</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="form_name"
                    aria-describedby="nameHelp"
                  />
                  <div id="linkHelp" class="form-text">
                    Напишите имя для ссылки
                  </div>
                </div>

                <button type="submit" id="add_link_btn" class="btn-solid bg-accent">
                  Добавить ссылку
                </button>
              </div>

              <div id="container_link" class="accordion accordion-gap px-5 py-5"></div>

            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>

    <script
      type="module"
      src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"
    ></script>
  </body>
</html>
